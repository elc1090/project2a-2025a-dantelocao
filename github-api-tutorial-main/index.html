<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>GitHub API</title>
  <link rel="icon" type="image/png" href="assets/favicon.ico">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

  <style>
    body {
      background-color: #f8f9fa;
    }

    .container {
      max-width: 600px;
      margin-top: 80px;
      background-color: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.05);
    }

    .form-control {
      margin-bottom: 20px;
    }

    .btn-primary {
      width: 100%;
    }

    #userRepos {
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2 class="text-center mb-4">Consulta à GitHub API</h2>
    <form id="gitHubForm">
      <div class="form-group">
        <label for="usernameInput">Nome de Usuário do GitHub</label>
        <input id="usernameInput" class="form-control" type="text" name="username" placeholder="ex: octocat" required>
      </div>
      <div class="form-group">
        <label for="userRepoInput">Nome do Repositório (opcional)</label>
        <input id="userRepoInput" class="form-control" type="text" name="userRepo" placeholder="ex: hello-world">
      </div>
      <button type="submit" class="btn btn-primary">Buscar</button>
    </form>

    <ul id="userRepos" class="list-group"></ul>
    <ul id="userCommits" class="list-group"></ul>
    
  </div>

  <script src="app.js"></script>
</body>

</html>
